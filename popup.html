<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 220px;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 12px;
      background: #fdf6fa;
      margin: 0;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px;
      color: #333;
    }
    select {
      width: 100%;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 13px;
      background: #fff;
    }
    p.hint {
      font-size: 11px;
      color: #777;
      margin: 8px 0 0;
    }
  </style>
</head>
<body>
  <h1>🌸 Choose your character</h1>
  <select id="character-select"></select>
  <p class="hint">Changes apply instantly </p>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
